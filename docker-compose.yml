version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: pr-reviewer-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: pr-reviewer-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/migrate:/migrations
    command:
      [
        '-path',
        '/migrations',
        '-database',
        'postgres://app:app@postgres:5432/app?sslmode=disable',
        'up',
      ]

  pr-reviewer:
    build: .
    container_name: pr-reviewer
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      POSTGRES_DSN: postgres://app:app@postgres:5432/app?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
